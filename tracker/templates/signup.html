<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign Up — Settlé</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
      rel="stylesheet">


<style>

/* =========================================================
   SETTLÉ — SIGN UP
   PLUM & MINT, CREAM BASE — MATCHES DASHBOARD THEME SYSTEM
   DJANGO LOGIC UNCHANGED
========================================================= */


:root {

    --mint: #5FE0A8;
    --mint-dark: #3DC48C;
    --mint-deep: #279A6C;

    --mint-light: #E3FBF0;
    --mint-soft: #F1FDF7;

    --plum: #3B1F3A;
    --plum-deep: #26132A;

    --white: #FFFFFF;

    --page-bg: #F7F5EE;

    --text: #1B1D18;
    --muted: #6E7268;
    --faint: #A7ABA0;

    --border: #E7E3D6;

    --coral: #E07A4F;
    --coral-soft: #FCEBE2;

    --gold: #D29F2E;
    --gold-soft: #FBF1DC;

    --sun: #FFC857;

    --shadow: 0 20px 55px rgba(38,19,42,0.10);

}


* {

    box-sizing:
        border-box;

    margin:
        0;

    padding:
        0;

}


html {

    scroll-behavior:
        smooth;

}


body {

    font-family:
        'Inter',
        sans-serif;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(95,224,168,0.16),
            transparent 25%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(95,224,168,0.12),
            transparent 25%
        ),

        linear-gradient(
            180deg,
            #FBFAF4,
            var(--page-bg) 45%,
            #F2EFE4
        );

    color:
        var(--text);

    min-height:
        100vh;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        35px 24px;

}


a {

    text-decoration:
        none;

    color:
        inherit;

}


button,
input,
select,
textarea {

    font-family:
        inherit;

}


h1 {

    font-family:
        'Poppins',
        sans-serif;

}


::selection {
    background: var(--mint);
    color: var(--plum-deep);
}


:focus-visible {
    outline: 2px solid var(--mint-dark);
    outline-offset: 2px;
    border-radius: 6px;
}


/* =========================================================
   ENTRANCE MOTION
========================================================= */

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}

.form-shell {
    animation: fadeUp 0.5s ease both;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
    }
}


/* =========================================================
   MAIN CARD
========================================================= */

.form-shell {

    position:
        relative;

    width:
        100%;

    max-width:
        650px;

    padding:
        36px 38px 30px;

    background:
        var(--white);

    border:
        1px solid
        var(--border);

    border-radius:
        26px;

    box-shadow:
        var(--shadow);

    overflow:
        hidden;

}


/* =========================================================
   DECORATIVE MINT CIRCLES
========================================================= */

.form-shell::before {

    content:
        "";

    position:
        absolute;

    width:
        240px;

    height:
        240px;

    top:
        -135px;

    right:
        -105px;

    border-radius:
        50%;

    background:
        rgba(95,224,168,0.16);

}


.form-shell::after {

    content:
        "";

    position:
        absolute;

    width:
        280px;

    height:
        280px;

    left:
        -140px;

    bottom:
        -160px;

    border-radius:
        50%;

    background:
        radial-gradient(circle, rgba(95,224,168,0.14), transparent 70%);

    pointer-events:
        none;

}


/* =========================================================
   BRAND
========================================================= */

.brand {

    position:
        relative;

    z-index:
        2;

    display:
        inline-flex;

    align-items:
        center;

    gap:
        9px;

    margin-bottom:
        22px;

    color:
        var(--mint-deep);

    font-family:
        'Poppins',
        sans-serif;

    font-size:
        0.9rem;

    font-weight:
        700;

    letter-spacing:
        -0.02em;

}


.brand-mark {

    width:
        34px;

    height:
        34px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        12px;

    background:

        linear-gradient(
            135deg,
            var(--mint),
            var(--mint-dark)
        );

    color:
        var(--plum-deep);

    font-size:
        0.85rem;

    font-weight:
        800;

    box-shadow:

        0 8px 20px
        rgba(0,0,0,0.22);

    transform:
        rotate(-4deg);

    transition:
        transform 0.3s ease;

}


.brand:hover .brand-mark {
    transform: rotate(4deg) scale(1.05);
}


/* =========================================================
   HEADER EYEBROW
========================================================= */

.header-eyebrow {

    position:
        relative;

    z-index:
        2;

    display:
        inline-flex;

    align-items:
        center;

    gap:
        8px;

    padding:
        6px 13px;

    margin-bottom:
        13px;

    border:
        1px solid
        var(--mint-light);

    border-radius:
        30px;

    background:
        var(--mint-soft);

    color:
        var(--mint-deep);

    font-size:
        0.60rem;

    font-weight:
        700;

    letter-spacing:
        0.05em;

    text-transform:
        uppercase;

}


.header-eyebrow .dot {

    width:
        6px;

    height:
        6px;

    border-radius:
        50%;

    background:
        var(--mint);

    box-shadow:
        0 0 0 4px
        rgba(95,224,168,0.18);

}


/* =========================================================
   HEADING
========================================================= */

h1 {

    position:
        relative;

    z-index:
        2;

    font-size:
        1.45rem;

    font-weight:
        700;

    letter-spacing:
        -0.03em;

    margin-bottom:
        7px;

}


.subtext {

    position:
        relative;

    z-index:
        2;

    color:
        var(--muted);

    font-size:
        0.70rem;

    line-height:
        1.6;

    margin-bottom:
        24px;

}


/* =========================================================
   ERROR MESSAGE
========================================================= */

.error-message {

    position:
        relative;

    z-index:
        2;

    margin-bottom:
        20px;

    padding:
        10px 12px;

    border:
        1px solid
        rgba(224,122,79,0.28);

    border-radius:
        11px;

    background:
        var(--coral-soft);

    color:
        #A6461F;

    font-size:
        0.68rem;

    font-weight:
        600;

}


/* =========================================================
   FORM GRID — 2 × 2
========================================================= */

.signup-form {

    position:
        relative;

    z-index:
        2;

}


.form-grid {

    display:
        grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap:
        16px 18px;

}


.form-group {

    min-width:
        0;

}


.form-group label {

    display:
        block;

    margin-bottom:
        7px;

    color:
        var(--text);

    font-size:
        0.68rem;

    font-weight:
        700;

}


.form-group input,
.form-group select,
.form-group textarea {

    width:
        100%;

    border:
        1px solid
        var(--border);

    border-radius:
        11px;

    background:
        var(--white);

    color:
        var(--text);

    font-size:
        0.72rem;

    transition:
        all 0.2s ease;

}


.form-group input,
.form-group select {

    height:
        43px;

    padding:
        0 13px;

}


.form-group textarea {

    min-height:
        75px;

    padding:
        11px 13px;

    resize:
        vertical;

    line-height:
        1.5;

}


.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {

    outline:
        none;

    border-color:
        var(--mint-dark);

    box-shadow:
        0 0 0 3px
        rgba(95,224,168,0.16);

}


/* =========================================================
   FULL WIDTH FIELDS
   BIO SPANS BOTH COLUMNS
========================================================= */

.form-group.full-width {

    grid-column:
        1 / -1;

}


/* =========================================================
   ACTIONS
========================================================= */

.form-actions {

    position:
        relative;

    z-index:
        2;

    padding-top:
        20px;

    margin-top:
        20px;

    background:

        repeating-linear-gradient(
            to right,
            var(--border) 0,
            var(--border) 6px,
            transparent 6px,
            transparent 13px
        )
        top / 100% 1.5px
        no-repeat;

}


.btn {

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    width:
        100%;

    padding:
        13px 20px;

    border:
        none;

    border-radius:
        20px;

    font-size:
        0.72rem;

    font-weight:
        700;

    cursor:
        pointer;

    transition:
        all 0.25s ease;

}


.btn:hover {

    transform:
        translateY(-2px);

}


.btn-primary {

    background:

        linear-gradient(
            135deg,
            var(--mint),
            var(--mint-dark)
        );

    color:
        var(--plum-deep);

    box-shadow:

        0 7px 17px
        rgba(0,0,0,0.22);

}


/* =========================================================
   LOGIN LINK
========================================================= */

.login-text {

    position:
        relative;

    z-index:
        2;

    margin-top:
        18px;

    text-align:
        center;

    color:
        var(--muted);

    font-size:
        0.68rem;

}


.login-text a {

    color:
        var(--mint-deep);

    font-weight:
        700;

    transition:
        color 0.2s ease;

}


.login-text a:hover {

    color:
        var(--mint-dark);

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px) {

    body {

        padding:
            20px 15px;

    }


    .form-shell {

        padding:
            30px 22px 26px;

    }


    .form-grid {

        grid-template-columns:
            1fr;

        gap:
            16px;

    }


    .form-group.full-width {

        grid-column:
            auto;

    }

}

</style>

</head>


<body>


<div class="form-shell">


    <!-- =================================================
         BRAND
    ================================================== -->

    <div class="brand">

        <div class="brand-mark">
            S
        </div>

        Settlé

    </div>


    <!-- =================================================
         HEADER
    ================================================== -->

    <div class="header-eyebrow">

        <span class="dot"></span>

        New account

    </div>


    <h1>Create your account</h1>


    <p class="subtext">
        Join Settlé and start managing your group expenses with ease.
    </p>


    <!-- =================================================
         ERROR MESSAGE
         DJANGO LOGIC PRESERVED
    ================================================== -->

    {% if error %}

        <p class="error-message">
            {{ error }}
        </p>

    {% endif %}


    <!-- =================================================
         ORIGINAL DJANGO FORM
         LOGIC COMPLETELY PRESERVED
    ================================================== -->

    <form
        method="POST"
        action="{% url 'userprofile_add' %}"
        class="signup-form"
    >

        {% csrf_token %}


        <!-- =================================================
             2 × 2 FORM GRID
        ================================================== -->

        <div class="form-grid">


            <!-- ROW 1 — FULL NAME -->

            <div class="form-group">

                <label for="name">
                    Full name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >

            </div>


            <!-- ROW 1 — EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

            </div>


            <!-- ROW 2 — PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                >

            </div>


            <!-- ROW 2 — NICKNAME -->

            <div class="form-group">

                <label for="nickname">
                    Nickname
                </label>

                <input
                    type="text"
                    id="nickname"
                    name="nickname"
                >

            </div>


            <!-- ROW 3 — PHONE -->

            <div class="form-group">

                <label for="phone">
                    Phone
                </label>

                <input
                    type="text"
                    id="phone"
                    name="phone"
                >

            </div>


            <!-- ROW 3 — GENDER -->

            <div class="form-group">

                <label for="gender">
                    Gender
                </label>

                <select
                    id="gender"
                    name="gender"
                >

                    <option value="">
                        Select
                    </option>

                    <option value="male">
                        Male
                    </option>

                    <option value="female">
                        Female
                    </option>

                    <option value="other">
                        Other
                    </option>

                </select>

            </div>


            <!-- ROW 4 — UPI ID -->

            <div class="form-group">

                <label for="upi_id">
                    UPI ID
                </label>

                <input
                    type="text"
                    id="upi_id"
                    name="upi_id"
                >

            </div>


            <!-- ROW 4 — BIO -->

            <div class="form-group">

                <label for="bio">
                    Bio
                </label>

                <textarea
                    id="bio"
                    name="bio"
                    maxlength="150"
                ></textarea>

            </div>


        </div>


        <!-- =================================================
             SUBMIT BUTTON
        ================================================== -->

        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Sign up
            </button>

        </div>


    </form>


    <!-- =================================================
         LOGIN LINK
         DJANGO LOGIC PRESERVED
    ================================================== -->

    <p class="login-text">

        Already have an account?

        <a href="{% url 'login_view' %}">
            Log in
        </a>

    </p>


</div>


</body>

</html>
