<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>No Profile Found — Settlé</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
          rel="stylesheet">


<style>

/* =========================================================
   SETTLÉ — NO PROFILE FOUND
   PLUM & MINT, CREAM BASE — MATCHES DASHBOARD THEME SYSTEM
   DJANGO LOGIC UNCHANGED
========================================================= */

:root {

    --mint: #5FE0A8;
    --mint-dark: #3DC48C;
    --mint-deep: #279A6C;

    --mint-light: #E3FBF0;
    --mint-soft: #F1FDF7;

    --plum: #3B1F3A;
    --plum-deep: #26132A;

    --white: #FFFFFF;

    --page-bg: #F7F5EE;

    --text: #1B1D18;
    --muted: #6E7268;
    --faint: #A7ABA0;

    --border: #E7E3D6;

    --coral: #E07A4F;
    --coral-soft: #FCEBE2;

    --gold: #D29F2E;
    --gold-soft: #FBF1DC;

    --sun: #FFC857;

    --shadow: 0 20px 55px rgba(38,19,42,0.10);

}


* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


html {

    scroll-behavior: smooth;

}


body {

    font-family:
        'Inter',
        sans-serif;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(95,224,168,0.16),
            transparent 25%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(95,224,168,0.12),
            transparent 25%
        ),

        linear-gradient(
            180deg,
            #FBFAF4,
            var(--page-bg) 45%,
            #F2EFE4
        );

    color:
        var(--text);

    min-height:
        100vh;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        24px;

}


a {

    text-decoration:
        none;

    color:
        inherit;

}


button {

    font-family:
        inherit;

}


h1 {

    font-family:
        'Poppins',
        sans-serif;

}


::selection {
    background: var(--mint);
    color: var(--plum-deep);
}


:focus-visible {
    outline: 2px solid var(--mint-dark);
    outline-offset: 2px;
    border-radius: 6px;
}


/* =========================================================
   ENTRANCE MOTION
========================================================= */

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}

.empty-shell {
    animation: fadeUp 0.5s ease both;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
    }
}


/* =========================================================
   CARD
========================================================= */

.empty-shell {

    position:
        relative;

    width:
        100%;

    max-width:
        460px;

    padding:
        40px 36px 34px;

    background:
        var(--white);

    border:
        1px solid
        var(--border);

    border-radius:
        26px;

    box-shadow:
        var(--shadow);

    text-align:
        center;

    overflow:
        hidden;

}


.empty-shell::before {

    content:
        "";

    position:
        absolute;

    width:
        220px;

    height:
        220px;

    top:
        -120px;

    right:
        -100px;

    border-radius:
        50%;

    background:
        rgba(95,224,168,0.16);

}


.empty-shell::after {

    content:
        "";

    position:
        absolute;

    width:
        260px;

    height:
        260px;

    left:
        -120px;

    bottom:
        -140px;

    border-radius:
        50%;

    background:
        radial-gradient(circle, rgba(95,224,168,0.14), transparent 70%);

    pointer-events:
        none;

}


.brand {

    position:
        relative;

    z-index:
        2;

    display:
        inline-flex;

    align-items:
        center;

    gap:
        9px;

    margin-bottom:
        26px;

    color:
        var(--mint-deep);

    font-family:
        'Poppins',
        sans-serif;

    font-size:
        0.9rem;

    font-weight:
        700;

    letter-spacing:
        -0.02em;

}


.brand-mark {

    width:
        34px;

    height:
        34px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        12px;

    background:

        linear-gradient(
            135deg,
            var(--mint),
            var(--mint-dark)
        );

    color:
        var(--plum-deep);

    font-size:
        0.85rem;

    font-weight:
        800;

    box-shadow:

        0 8px 20px
        rgba(0,0,0,0.22);

    transform:
        rotate(-4deg);

    transition:
        transform 0.3s ease;

}


.brand:hover .brand-mark {
    transform: rotate(4deg) scale(1.05);
}


/* profile-shaped mark instead of a generic icon */

.profile-mark {

    position:
        relative;

    z-index:
        2;

    width:
        58px;

    height:
        58px;

    margin:
        0 auto 20px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        18px;

    background:
        var(--mint-light);

    box-shadow:
        inset 0 0 0 2px
        rgba(95,224,168,0.30);

}


.profile-mark::before {

    content:
        "";

    width:
        18px;

    height:
        18px;

    border-radius:
        50%;

    background:
        var(--mint-deep);

    box-shadow:

        0 15px 0 -3px
        var(--mint-deep);

    position:
        relative;

    top:
        -3px;

}


h1 {

    position:
        relative;

    z-index:
        2;

    font-size:
        1.25rem;

    font-weight:
        700;

    letter-spacing:
        -0.03em;

    line-height:
        1.35;

    margin-bottom:
        11px;

}


p {

    position:
        relative;

    z-index:
        2;

    max-width:
        360px;

    margin:
        0 auto 26px;

    color:
        var(--muted);

    font-size:
        0.74rem;

    line-height:
        1.7;

}


/* =========================================================
   ACTIONS
========================================================= */

.actions {

    position:
        relative;

    z-index:
        2;

    display:
        flex;

    flex-direction:
        column;

    gap:
        10px;

    padding-top:
        22px;

    background:

        repeating-linear-gradient(
            to right,
            var(--border) 0,
            var(--border) 6px,
            transparent 6px,
            transparent 13px
        )
        top / 100% 1.5px
        no-repeat;

}


.btn {

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    width:
        100%;

    padding:
        13px 20px;

    border:
        none;

    border-radius:
        20px;

    font-size:
        0.72rem;

    font-weight:
        700;

    cursor:
        pointer;

    transition:
        all 0.25s ease;

}


.btn:hover {

    transform:
        translateY(-2px);

}


.btn-primary {

    background:

        linear-gradient(
            135deg,
            var(--mint),
            var(--mint-dark)
        );

    color:
        var(--plum-deep);

    box-shadow:

        0 7px 17px
        rgba(0,0,0,0.22);

}


.btn-secondary {

    background:
        var(--white);

    color:
        var(--muted);

    border:
        1px solid
        var(--border);

}


.btn-secondary:hover {

    color:
        var(--mint-deep);

    border-color:
        var(--mint-dark);

}


@media(max-width:500px) {

    .empty-shell {

        padding:
            32px 24px 28px;

    }

}

</style>

</head>

<body>


<div class="empty-shell">


    <div class="brand">

        <div class="brand-mark">
            S
        </div>

        Settlé

    </div>


    <div class="profile-mark"></div>


    <h1>You don't have a profile yet</h1>

    <p>To access your dashboard, join a group, or create a group, you'll need a profile first.</p>


    <div class="actions">

        <a href="{% url 'userprofile_add' %}">
            <button class="btn btn-primary">Create Profile</button>
        </a>

        <a href="{% url 'admin_home' %}">
            <button class="btn btn-secondary">Back to Admin Overview</button>
        </a>

    </div>


</div>


</body>

</html>
