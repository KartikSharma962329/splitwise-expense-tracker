<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pay a Member — Settlé</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
          rel="stylesheet">


<style>

/* =========================================================
   SETTLÉ — PAY A MEMBER
   PLUM & MINT, CREAM BASE — MATCHES DASHBOARD THEME SYSTEM
   DJANGO LOGIC UNCHANGED
========================================================= */

:root {

    --mint: #5FE0A8;
    --mint-dark: #3DC48C;
    --mint-deep: #279A6C;

    --mint-light: #E3FBF0;
    --mint-soft: #F1FDF7;

    --plum: #3B1F3A;
    --plum-deep: #26132A;

    --white: #FFFFFF;

    --page-bg: #F7F5EE;

    --text: #1B1D18;
    --muted: #6E7268;
    --faint: #A7ABA0;

    --border: #E7E3D6;

    --coral: #E07A4F;
    --coral-soft: #FCEBE2;

    --gold: #D29F2E;
    --gold-soft: #FBF1DC;

    --sun: #FFC857;

    --shadow: 0 20px 55px rgba(38,19,42,0.10);

}


* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

}


html {

    scroll-behavior: smooth;

}


body {

    font-family:
        'Inter',
        sans-serif;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(95,224,168,0.16),
            transparent 25%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(95,224,168,0.12),
            transparent 25%
        ),

        linear-gradient(
            180deg,
            #FBFAF4,
            var(--page-bg) 45%,
            #F2EFE4
        );

    color:
        var(--text);

    min-height:
        100vh;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    padding:
        24px;

}


a {

    text-decoration:
        none;

    color:
        inherit;

}


button,
input,
select {

    font-family:
        inherit;

}


h1 {

    font-family:
        'Poppins',
        sans-serif;

}


::selection {
    background: var(--mint);
    color: var(--plum-deep);
}


:focus-visible {
    outline: 2px solid var(--mint-dark);
    outline-offset: 2px;
    border-radius: 6px;
}


/* =========================================================
   ENTRANCE MOTION
========================================================= */

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}

.form-shell {
    animation: fadeUp 0.5s ease both;
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
    }
}


/* =========================================================
   MAIN CARD
========================================================= */

.form-shell {

    position:
        relative;

    width:
        100%;

    max-width:
        440px;

    padding:
        38px 34px 32px;

    background:
        var(--white);

    border:
        1px solid
        var(--border);

    border-radius:
        26px;

    box-shadow:
        var(--shadow);

    overflow:
        hidden;

}


/* =========================================================
   DECORATIVE MINT CIRCLES
========================================================= */

.form-shell::before {

    content:
        "";

    position:
        absolute;

    width:
        220px;

    height:
        220px;

    top:
        -120px;

    right:
        -100px;

    border-radius:
        50%;

    background:
        rgba(95,224,168,0.16);

}


.form-shell::after {

    content:
        "";

    position:
        absolute;

    width:
        260px;

    height:
        260px;

    left:
        -130px;

    bottom:
        -150px;

    border-radius:
        50%;

    background:
        radial-gradient(circle, rgba(95,224,168,0.14), transparent 70%);

    pointer-events:
        none;

}


/* =========================================================
   BRAND
========================================================= */

.brand {

    position:
        relative;

    z-index:
        2;

    display:
        inline-flex;

    align-items:
        center;

    gap:
        9px;

    margin-bottom:
        26px;

    color:
        var(--mint-deep);

    font-family:
        'Poppins',
        sans-serif;

    font-size:
        0.9rem;

    font-weight:
        700;

    letter-spacing:
        -0.02em;

}


.brand-mark {

    width:
        34px;

    height:
        34px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        12px;

    background:

        linear-gradient(
            135deg,
            var(--mint),
            var(--mint-dark)
        );

    color:
        var(--plum-deep);

    font-size:
        0.85rem;

    font-weight:
        800;

    box-shadow:

        0 8px 20px
        rgba(0,0,0,0.22);

    transform:
        rotate(-4deg);

    transition:
        transform 0.3s ease;

}


.brand:hover .brand-mark {
    transform: rotate(4deg) scale(1.05);
}


/* =========================================================
   HEADER EYEBROW
========================================================= */

.header-eyebrow {

    position:
        relative;

    z-index:
        2;

    display:
        inline-flex;

    align-items:
        center;

    gap:
        8px;

    padding:
        6px 13px;

    margin-bottom:
        13px;

    border:
        1px solid
        var(--mint-light);

    border-radius:
        30px;

    background:
        var(--mint-soft);

    color:
        var(--mint-deep);

    font-size:
        0.60rem;

    font-weight:
        700;

    letter-spacing:
        0.05em;

    text-transform:
        uppercase;

}


.header-eyebrow .dot {

    width:
        6px;

    height:
        6px;

    border-radius:
        50%;

    background:
        var(--mint);

    box-shadow:
        0 0 0 4px
        rgba(95,224,168,0.18);

}


/* =========================================================
   HEADING
========================================================= */

h1 {

    position:
        relative;

    z-index:
        2;

    font-size:
        1.35rem;

    font-weight:
        700;

    letter-spacing:
        -0.03em;

    margin-bottom:
        6px;

}


.subtext {

    position:
        relative;

    z-index:
        2;

    color:
        var(--muted);

    font-size:
        0.70rem;

    line-height:
        1.6;

    margin-bottom:
        26px;

}


/* =========================================================
   GROUP INFORMATION
========================================================= */

.group-info {

    position:
        relative;

    z-index:
        2;

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    margin-bottom:
        24px;

    padding:
        10px 12px;

    border:
        1px solid
        var(--mint-light);

    border-radius:
        11px;

    background:
        var(--mint-soft);

    color:
        var(--mint-deep);

    font-size:
        0.68rem;

    font-weight:
        600;

}


.group-icon {

    width:
        25px;

    height:
        25px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    border-radius:
        8px;

    background:
        var(--mint-light);

    font-size:
        0.75rem;

}


/* =========================================================
   FORM
========================================================= */

.form-group {

    position:
        relative;

    z-index:
        2;

    margin-bottom:
        18px;

}


.form-group label {

    display:
        block;

    margin-bottom:
        7px;

    color:
        var(--text);

    font-size:
        0.68rem;

    font-weight:
        700;

}


/* =========================================================
   INPUTS & SELECTS
========================================================= */

.form-group input,
.form-group select {

    width:
        100%;

    height:
        43px;

    padding:
        0 13px;

    border:
        1px solid
        var(--border);

    border-radius:
        11px;

    background:
        var(--white);

    color:
        var(--text);

    font-size:
        0.72rem;

    transition:
        all 0.2s ease;

}


.form-group input:focus,
.form-group select:focus {

    outline:
        none;

    border-color:
        var(--mint-dark);

    box-shadow:
        0 0 0 3px
        rgba(95,224,168,0.16);

}


/* =========================================================
   PAYMENT DETAILS
========================================================= */

.payment-section {

    position:
        relative;

    z-index:
        2;

}


/* =========================================================
   ACTIONS
========================================================= */

.form-actions {

    position:
        relative;

    z-index:
        2;

    padding-top:
        20px;

    margin-top:
        4px;

    background:

        repeating-linear-gradient(
            to right,
            var(--border) 0,
            var(--border) 6px,
            transparent 6px,
            transparent 13px
        )
        top / 100% 1.5px
        no-repeat;

}


.btn {

    display:
        inline-flex;

    align-items:
        center;

    justify-content:
        center;

    width:
        100%;

    padding:
        13px 20px;

    border:
        none;

    border-radius:
        20px;

    font-size:
        0.72rem;

    font-weight:
        700;

    cursor:
        pointer;

    transition:
        all 0.25s ease;

}


.btn:hover {

    transform:
        translateY(-2px);

}


.btn-primary {

    background:

        linear-gradient(
            135deg,
            var(--mint),
            var(--mint-dark)
        );

    color:
        var(--plum-deep);

    box-shadow:

        0 7px 17px
        rgba(0,0,0,0.22);

}


/* =========================================================
   BACK LINK
========================================================= */

.back-link {

    position:
        relative;

    z-index:
        2;

    display:
        block;

    margin-top:
        18px;

    text-align:
        center;

    color:
        var(--muted);

    font-size:
        0.68rem;

    font-weight:
        600;

    transition:
        color 0.2s ease;

}


.back-link:hover {

    color:
        var(--mint-deep);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:500px) {

    .form-shell {

        padding:
            30px 22px 26px;

    }

}

</style>

</head>


<body>


<div class="form-shell">


    <!-- =================================================
         BRAND
    ================================================== -->

    <div class="brand">

        <div class="brand-mark">
            S
        </div>

        Settlé

    </div>


    <!-- =================================================
         HEADER
    ================================================== -->

    <div class="header-eyebrow">

        <span class="dot"></span>

        Payment

    </div>


    <h1>Pay a Member</h1>


    <p class="subtext">
        Record a payment you've made to another member of your group.
    </p>


    <!-- =================================================
         ORIGINAL GROUP INFORMATION
         DJANGO LOGIC PRESERVED
    ================================================== -->

    <div class="group-info">

        <div class="group-icon">
            #
        </div>

        <span>
            Group: {{ group.group_name }}
        </span>

    </div>


    <!-- =================================================
         ORIGINAL DJANGO FORM
         LOGIC COMPLETELY PRESERVED
    ================================================== -->

    <form method="POST" action="{% url 'record_payment' %}">

        {% csrf_token %}


        <div class="payment-section">


            <!-- PAY TO -->

            <div class="form-group">

                <label>Pay to:</label>

                <select name="receiver_email" required>

                    {% for m in member_list %}

                        <option value="{{ m.profile.email }}">

                            {{ m.profile.name }}

                            {% if m.pending_paise > 0 %}

                                — you owe ₹{% widthratio m.pending_paise 100 1 %}

                            {% elif m.pending_paise < 0 %}

                                — they owe you ₹{% widthratio m.pending_paise -100 1 %}

                            {% else %}

                                — settled up

                            {% endif %}

                        </option>

                    {% endfor %}

                </select>

            </div>


            <!-- AMOUNT -->

            <div class="form-group">

                <label>Amount (₹):</label>

                <input
                    type="number"
                    name="amount"
                    step="0.01"
                    min="0.01"
                    required
                >

            </div>


            <!-- MODE -->

            <div class="form-group">

                <label>Mode:</label>

                <select name="mode">

                    <option value="offline">
                        Offline (cash)
                    </option>

                    <option value="online">
                        Online (UPI/bank)
                    </option>

                </select>

            </div>


            <!-- NOTE -->

            <div class="form-group">

                <label>Note (optional):</label>

                <input
                    type="text"
                    name="note"
                    maxlength="255"
                >

            </div>


        </div>


        <!-- =================================================
             SUBMIT BUTTON
        ================================================== -->

        <div class="form-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                Submit Payment
            </button>

        </div>


    </form>


    <!-- =================================================
         BACK TO GROUP
         DJANGO LOGIC PRESERVED
    ================================================== -->

    <p class="back-link">

        <a href="{% url 'group_home' %}">
            ← Back to Group
        </a>

    </p>


</div>


</body>

</html>
